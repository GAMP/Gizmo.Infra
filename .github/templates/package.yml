# Canonical single caller-owned NuGet package workflow.
# Copy this file to a consumer repository at .github/workflows/package.yml.
# Replace every `<40-character-infra-commit-sha>` with one immutable Gizmo.Infra commit SHA.
# Replace the two branch placeholders with the package's real development and production branches.
# The workflow filename binds NuGet.org Trusted Publishing and must not be renamed.
name: Package

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# The caller owns the only lock; the reusable workflows declare none so they cannot nest.
concurrency:
  group: nuget-${{ github.repository }}
  cancel-in-progress: false

# Each physical branch name is declared exactly once here and passed to Gizmo.Infra by alias.
env:
  DEVELOPMENT_BRANCH: &development_branch <development-branch>
  PRODUCTION_BRANCH: &production_branch <production-branch>

jobs:
  validate:
    # Pull requests only validate; they never publish or tag.
    if: ${{ github.event_name == 'pull_request' }}
    uses: GAMP/Gizmo.Infra/.github/workflows/package-validation.yml@<40-character-infra-commit-sha>
    permissions:
      contents: read
    with:
      development-branch: *development_branch
      production-branch: *production_branch

  prepare:
    # Push and manual dispatch resolve the branch role and prepare the package.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: GAMP/Gizmo.Infra/.github/workflows/package-publish.yml@<40-character-infra-commit-sha>
    permissions:
      contents: read
    with:
      development-branch: *development_branch
      production-branch: *production_branch

  publish-public:
    needs: prepare
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.branch-role != 'none' && needs.prepare.outputs.repository-visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish public package
        uses: GAMP/Gizmo.Infra/.github/actions/package-public-publish@<40-character-infra-commit-sha>
        with:
          package-id: ${{ needs.prepare.outputs.package-id }}
          nuget-user: ${{ vars.NUGET_USER }}
          package-artifact: ${{ needs.prepare.outputs.package-artifact }}
          package-version: ${{ needs.prepare.outputs.package-version }}
          calculated-state: ${{ needs.prepare.outputs.calculated-state }}
          tag-state-fingerprint: ${{ needs.prepare.outputs.tag-state-fingerprint }}
          repository-visibility: ${{ needs.prepare.outputs.repository-visibility }}

  publish-private:
    needs: prepare
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.branch-role != 'none' && needs.prepare.outputs.repository-visibility == 'private' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish private package
        uses: GAMP/Gizmo.Infra/.github/actions/package-private-publish@<40-character-infra-commit-sha>
        with:
          package-id: ${{ needs.prepare.outputs.package-id }}
          package-artifact: ${{ needs.prepare.outputs.package-artifact }}
          package-version: ${{ needs.prepare.outputs.package-version }}
          calculated-state: ${{ needs.prepare.outputs.calculated-state }}
          tag-state-fingerprint: ${{ needs.prepare.outputs.tag-state-fingerprint }}
          repository-visibility: ${{ needs.prepare.outputs.repository-visibility }}

  reject-unsupported-visibility:
    needs: prepare
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.branch-role != 'none' && needs.prepare.outputs.repository-visibility != 'public' && needs.prepare.outputs.repository-visibility != 'private' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed for unsupported visibility
        shell: bash
        env:
          REPOSITORY_VISIBILITY: ${{ needs.prepare.outputs.repository-visibility }}
        run: |
          set -euo pipefail
          echo "Unsupported caller repository visibility '$REPOSITORY_VISIBILITY' for this branch role; refusing to publish or tag." >&2
          exit 1

  tag:
    needs:
      - prepare
      - publish-public
      - publish-private
    if: ${{ always() && github.event_name != 'pull_request' && needs.prepare.outputs.branch-role == 'production' && (needs.publish-public.result == 'success' || needs.publish-private.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reconcile immutable production tag
        uses: GAMP/Gizmo.Infra/.github/actions/package-release-tag@<40-character-infra-commit-sha>
        with:
          branch-role: ${{ needs.prepare.outputs.branch-role }}
          release-tag: ${{ needs.prepare.outputs.release-tag }}
          calculated-state: ${{ needs.prepare.outputs.calculated-state }}
          tag-state-fingerprint: ${{ needs.prepare.outputs.tag-state-fingerprint }}
