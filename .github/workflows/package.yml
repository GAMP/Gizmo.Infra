name: NuGet package

on:
  workflow_call:
    inputs:
      dev:
        description: Caller development branch name declared once in the single caller workflow.
        required: true
        type: string
      prod:
        description: Caller production branch name declared once in the single caller workflow.
        required: true
        type: string
    outputs:
      publisher:
        description: "Destination capability for a publishable run: nuget, internal, or none."
        value: ${{ jobs.plan.outputs.publisher }}
      tag:
        description: Whether a caller-owned immutable production tag should be reconciled.
        value: ${{ jobs.plan.outputs.tag }}
      state:
        description: Opaque versioned package state consumed only by Gizmo.Infra actions.
        value: ${{ jobs.plan.outputs.state }}

permissions: {}

jobs:
  plan:
    name: Plan, validate, and prepare package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publisher: ${{ steps.gate.outputs.role == 'none' && 'none' || steps.plan.outputs.publisher }}
      tag: ${{ steps.gate.outputs.role == 'none' && 'false' || steps.plan.outputs.tag }}
      state: ${{ steps.gate.outputs.role == 'none' && '' || steps.seal.outputs.state }}
    steps:
      - name: Resolve caller branch role cheaply
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          DEV_BRANCH: ${{ inputs.dev }}
          PROD_BRANCH: ${{ inputs.prod }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          [[ -n "$DEV_BRANCH" && -n "$PROD_BRANCH" ]] || fail "The dev and prod branch inputs are both required."
          [[ "$DEV_BRANCH" != "$PROD_BRANCH" ]] || fail "The dev and prod branches must differ."
          git check-ref-format --branch "$DEV_BRANCH" > /dev/null 2>&1 || fail "The dev branch input is not a valid branch name."
          git check-ref-format --branch "$PROD_BRANCH" > /dev/null 2>&1 || fail "The prod branch input is not a valid branch name."
          effective_ref="$REF"
          if [[ "$EVENT_NAME" == pull_request ]]; then effective_ref="refs/heads/$BASE_REF"; fi
          role=none
          if [[ "$effective_ref" == "refs/heads/$DEV_BRANCH" ]]; then role=development
          elif [[ "$effective_ref" == "refs/heads/$PROD_BRANCH" ]]; then role=production
          fi
          printf 'role=%s\n' "$role" >> "$GITHUB_OUTPUT"

      - name: Checkout caller repository
        if: ${{ steps.gate.outputs.role != 'none' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        if: ${{ steps.gate.outputs.role != 'none' }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 11.0.x

      - name: Validate immutable Gizmo.Infra workflow identity
        if: ${{ steps.gate.outputs.role != 'none' }}
        id: infra-source
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          expected_workflow_ref="GAMP/Gizmo.Infra/.github/workflows/package.yml@"
          workflow_ref_sha=${WORKFLOW_REF#"$expected_workflow_ref"}
          if [[ "$WORKFLOW_REPOSITORY" != GAMP/Gizmo.Infra ]] || [[ "$WORKFLOW_FILE_PATH" != .github/workflows/package.yml ]] || [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$workflow_ref_sha" == "$WORKFLOW_REF" ]] || [[ ! "$workflow_ref_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$workflow_ref_sha" != "$WORKFLOW_SHA" ]]; then
            echo "The reusable workflow must be called from the expected Gizmo.Infra file with a complete immutable commit SHA." >&2
            exit 1
          fi
          printf 'repository=%s\nref=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable Gizmo.Infra action source
        if: ${{ steps.gate.outputs.role != 'none' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ steps.infra-source.outputs.repository }}
          ref: ${{ steps.infra-source.outputs.ref }}
          path: .gizmo-infra
          persist-credentials: false

      - name: Discover caller package metadata
        if: ${{ steps.gate.outputs.role != 'none' }}
        id: metadata
        uses: ./.gizmo-infra/.github/actions/preflight
        with:
          caller-repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          dev: ${{ inputs.dev }}
          prod: ${{ inputs.prod }}
          current-ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}

      - name: Plan package version and tag state
        if: ${{ steps.gate.outputs.role != 'none' }}
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          DEV_BRANCH: ${{ inputs.dev }}
          PROD_BRANCH: ${{ inputs.prod }}
          BRANCH_ROLE: ${{ steps.metadata.outputs.branch-role }}
          PACKAGE_ID: ${{ steps.metadata.outputs.package-id }}
          COMPATIBILITY_LINE: ${{ steps.metadata.outputs.compatibility-line }}
          VISIBILITY: ${{ steps.metadata.outputs.repository-visibility }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          STATE_PY="$GITHUB_WORKSPACE/.gizmo-infra/.github/package/state.py"
          response_file=$(mktemp); tag_object_file=$(mktemp); rows_file=$(mktemp); request_file=$(mktemp)
          trap 'rm -f "$response_file" "$tag_object_file" "$rows_file" "$request_file"' EXIT
          fetch_tag_rows() {
            local page=1 count status
            while :; do
              if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$PACKAGE_ID/?per_page=100&page=$page"); then
                echo "Could not fetch caller-repository package tag refs." >&2
                return 1
              fi
              if [[ "$status" != 200 ]] || ! jq -e 'type == "array" and all(.[]; (.ref | type == "string") and (.object | type == "object") and (.object.type | type == "string") and (.object.sha | type == "string"))' "$response_file" > /dev/null; then
                echo "GitHub returned a malformed package tag-ref response." >&2
                return 1
              fi
              jq -r '.[] | [.ref, .object.type, .object.sha] | @tsv' "$response_file"
              count=$(jq -er 'length' "$response_file")
              if (( count < 100 )); then
                return 0
              fi
              ((page += 1))
            done
          }
          resolve_commit() {
            local object_type=$1 object_sha=$2 status depth=0
            while :; do
              case "$object_type" in
                commit) printf '%s' "$object_sha"; return 0 ;;
                tag)
                  ((depth += 1))
                  if (( depth > 16 )) || ! status=$(curl --silent --show-error --location --output "$tag_object_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"); then
                    echo "Could not resolve an annotated package tag." >&2
                    return 1
                  fi
                  if [[ "$status" != 200 ]] || ! object_type=$(jq -er '.object.type | strings' "$tag_object_file") || ! object_sha=$(jq -er '.object.sha | strings' "$tag_object_file"); then
                    echo "GitHub returned a malformed annotated package-tag response." >&2
                    return 1
                  fi
                  ;;
                *) echo "Package tag ref does not resolve to a commit." >&2; return 1 ;;
              esac
            done
          }
          tag_rows=$(fetch_tag_rows)
          : > "$rows_file"
          while IFS=$'\t' read -r ref object_type object_sha; do
            [[ -z "$ref" ]] && continue
            commit=$(resolve_commit "$object_type" "$object_sha") || exit 1
            printf '%s\t%s\t%s\n' "$ref" "$object_sha" "$commit" >> "$rows_file"
          done <<< "$tag_rows"
          tags_json=$(jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {ref: .[0], objectSha: .[1], commit: .[2]})' "$rows_file")
          jq -nc \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$CURRENT_REF" \
            --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$EVENT_NAME" \
            --arg dev "$DEV_BRANCH" \
            --arg prod "$PROD_BRANCH" \
            --arg role "$BRANCH_ROLE" \
            --arg packageId "$PACKAGE_ID" \
            --arg compatibilityLine "$COMPATIBILITY_LINE" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg visibility "$VISIBILITY" \
            --argjson tags "$tags_json" \
            '{repo: $repo, sha: $sha, ref: $ref, run: $run, attempt: $attempt, event: $event, dev: $dev, prod: $prod, role: $role, packageId: $packageId, compatibilityLine: $compatibilityLine, runNumber: $runNumber, visibility: $visibility, tags: $tags}' > "$request_file"
          python3 "$STATE_PY" plan < "$request_file" >> "$GITHUB_OUTPUT"

      - name: Restore with NuGet audit
        if: ${{ steps.gate.outputs.role != 'none' }}
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
        run: dotnet restore "$PROJECT_PATH" -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1904%3BNU1903 -p:WarningsNotAsErrors=NU1901%3BNU1902

      - name: Build
        if: ${{ steps.gate.outputs.role != 'none' }}
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Pack calculated package version
        if: ${{ steps.gate.outputs.role != 'none' }}
        shell: bash
        env:
          CALCULATED_VERSION: ${{ steps.plan.outputs.package-version }}
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
        run: dotnet pack "$PROJECT_PATH" --configuration Release --no-restore --output artifacts -p:RepositoryCommit="$GITHUB_SHA" -p:PackageVersion="$CALCULATED_VERSION"

      - name: Seal package state with artifact digest
        if: ${{ steps.gate.outputs.role != 'none' }}
        id: seal
        shell: bash
        env:
          PLANNED_STATE: ${{ steps.plan.outputs.planned-state }}
          ARTIFACT_PATH: ${{ steps.plan.outputs.package-artifact }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          STATE_PY="$GITHUB_WORKSPACE/.gizmo-infra/.github/package/state.py"
          digest=$(sha256sum "$ARTIFACT_PATH" | cut -d ' ' -f1)
          printf '%s' "$PLANNED_STATE" | python3 "$STATE_PY" seal --digest "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload exact package artifact
        if: ${{ steps.gate.outputs.role != 'none' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.package-artifact }}
          if-no-files-found: error
