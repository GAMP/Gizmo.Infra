name: NuGet package validation

on:
  workflow_call:
    inputs:
      development-branch:
        description: Caller development branch name declared once in the single caller workflow.
        required: true
        type: string
      production-branch:
        description: Caller production branch name declared once in the single caller workflow.
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Validate and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version-state.outputs.package-version }}
      calculated-state: ${{ steps.version-state.outputs.calculated-state }}
      tag-state-fingerprint: ${{ steps.version-state.outputs.tag-state-fingerprint }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 11.0.x

      - name: Validate immutable Gizmo.Infra workflow identity
        id: infra-source
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail
          expected_workflow_ref="GAMP/Gizmo.Infra/.github/workflows/package-validation.yml@"
          workflow_ref_sha=${WORKFLOW_REF#"$expected_workflow_ref"}
          if [[ "$WORKFLOW_REPOSITORY" != GAMP/Gizmo.Infra ]] || [[ "$WORKFLOW_FILE_PATH" != .github/workflows/package-validation.yml ]] || [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$workflow_ref_sha" == "$WORKFLOW_REF" ]] || [[ ! "$workflow_ref_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$workflow_ref_sha" != "$WORKFLOW_SHA" ]]; then
            echo "The reusable workflow must be called from the expected Gizmo.Infra file with a complete immutable commit SHA." >&2
            exit 1
          fi
          printf 'repository=%s\nref=%s\n' "$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable Gizmo.Infra action source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ steps.infra-source.outputs.repository }}
          ref: ${{ steps.infra-source.outputs.ref }}
          path: .gizmo-infra
          persist-credentials: false

      - name: Discover caller package metadata
        id: metadata
        uses: ./.gizmo-infra/.github/actions/preflight
        with:
          caller-repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          development-branch: ${{ inputs.development-branch }}
          production-branch: ${{ inputs.production-branch }}
          current-ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}

      - name: Calculate package version and tag state
        id: version-state
        if: ${{ steps.metadata.outputs.branch-role != 'none' }}
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.metadata.outputs.package-id }}
          COMPATIBILITY_LINE: ${{ steps.metadata.outputs.compatibility-line }}
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          response_file=$(mktemp)
          tag_object_file=$(mktemp)
          trap 'rm -f "$response_file" "$tag_object_file"' EXIT
          fetch_tag_rows() {
            local page=1 count status
            while :; do
              if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$PACKAGE_ID/?per_page=100&page=$page"); then
                echo "Could not fetch caller-repository package tag refs." >&2
                return 1
              fi
              if [[ "$status" != 200 ]] || ! jq -e 'type == "array" and all(.[]; (.ref | type == "string") and (.object | type == "object") and (.object.type | type == "string") and (.object.sha | type == "string"))' "$response_file" > /dev/null; then
                echo "GitHub returned a malformed package tag-ref response." >&2
                return 1
              fi
              jq -r '.[] | [.ref, .object.type, .object.sha] | @tsv' "$response_file"
              count=$(jq -er 'length' "$response_file")
              if (( count < 100 )); then
                return 0
              fi
              ((page += 1))
            done
          }
          resolve_commit() {
            local object_type=$1 object_sha=$2 status depth=0
            while :; do
              case "$object_type" in
                commit) printf '%s' "$object_sha"; return 0 ;;
                tag)
                  ((depth += 1))
                  if (( depth > 16 )) || ! status=$(curl --silent --show-error --location --output "$tag_object_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"); then
                    echo "Could not resolve an annotated package tag." >&2
                    return 1
                  fi
                  if [[ "$status" != 200 ]] || ! object_type=$(jq -er '.object.type | strings' "$tag_object_file") || ! object_sha=$(jq -er '.object.sha | strings' "$tag_object_file"); then
                    echo "GitHub returned a malformed annotated package-tag response." >&2
                    return 1
                  fi
                  ;;
                *) echo "Package tag ref does not resolve to a commit." >&2; return 1 ;;
              esac
            done
          }
          increment_decimal() {
            local value=$1 result='' digit carry=1 i
            for ((i=${#value}-1; i>=0; i--)); do
              digit=${value:i:1}
              if (( carry )); then
                if [[ "$digit" == 9 ]]; then
                  digit=0
                else
                  digit=$((10#$digit + 1))
                  carry=0
                fi
              fi
              result="$digit$result"
            done
            if (( carry )); then result="1$result"; fi
            printf '%s' "$result"
          }
          # Canonical decimals on the same length compare ordinally; a longer canonical decimal is numerically larger.
          decimal_gt() {
            local left=$1 right=$2
            if (( ${#left} != ${#right} )); then
              (( ${#left} > ${#right} ))
            else
              [[ "$left" > "$right" ]]
            fi
          }
          tag_rows=$(fetch_tag_rows)
          tag_prefix="refs/tags/${PACKAGE_ID}/"
          max_patch=''
          governed_major=''
          governed_minor=''
          tag_snapshot=''
          while IFS=$'\t' read -r ref object_type object_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$ref" != "$tag_prefix"* ]]; then
              echo "GitHub returned a tag outside the requested package prefix." >&2
              exit 1
            fi
            tag_leaf=${ref#"$tag_prefix"}
            if [[ ! "$tag_leaf" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Malformed tag under the exact package prefix: $ref" >&2
              exit 1
            fi
            tag_line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            tag_major=${BASH_REMATCH[1]}
            tag_minor=${BASH_REMATCH[2]}
            tag_patch=${BASH_REMATCH[3]}
            tag_commit=$(resolve_commit "$object_type" "$object_sha")
            tag_snapshot+="${ref}=${object_sha}"$'\n'
            if [[ -z "$governed_major" ]] || decimal_gt "$tag_major" "$governed_major" || { [[ "$tag_major" == "$governed_major" ]] && decimal_gt "$tag_minor" "$governed_minor"; }; then
              governed_major=$tag_major
              governed_minor=$tag_minor
            fi
            if [[ "$tag_line" == "$COMPATIBILITY_LINE" ]] && { [[ -z "$max_patch" ]] || (( ${#tag_patch} > ${#max_patch} )) || { (( ${#tag_patch} == ${#max_patch} )) && [[ "$tag_patch" > "$max_patch" ]]; }; }; then
              max_patch=$tag_patch
            fi
          done <<< "$tag_rows"
          # The project line may only stay on the highest governed line, advance one minor, or advance one major with a minor reset.
          if [[ -n "$governed_major" ]]; then
            declared_major=${COMPATIBILITY_LINE%%.*}
            declared_minor=${COMPATIBILITY_LINE#*.}
            expected_minor=$(increment_decimal "$governed_minor")
            expected_major=$(increment_decimal "$governed_major")
            if [[ "$declared_major" == "$governed_major" && "$declared_minor" == "$governed_minor" ]]; then
              :
            elif [[ "$declared_major" == "$governed_major" && "$declared_minor" == "$expected_minor" ]]; then
              :
            elif [[ "$declared_major" == "$expected_major" && "$declared_minor" == 0 ]]; then
              :
            else
              echo "Declared compatibility line ${COMPATIBILITY_LINE} is not a governed transition from ${governed_major}.${governed_minor}." >&2
              exit 1
            fi
          fi
          if [[ -z "$max_patch" ]]; then
            patch=0
          else
            patch=$(increment_decimal "$max_patch")
          fi
          base_version="${COMPATIBILITY_LINE}.${patch}"
          package_version="${base_version}-pr.${GITHUB_RUN_NUMBER}"
          tag_snapshot=$(printf '%s' "$tag_snapshot" | sort)
          tag_state_fingerprint=$(printf '%s' "$tag_snapshot" | sha256sum | cut -d ' ' -f1)
          tag_state=$(printf '%s' "$tag_snapshot" | base64 --wrap=0)
          calculated_state="package-id=${PACKAGE_ID};compatibility-line=${COMPATIBILITY_LINE};base-version=${base_version};package-version=${package_version};release-tag=${PACKAGE_ID}/v${base_version};tag-state=${tag_state}"
          package_artifact="artifacts/${PACKAGE_ID}.${package_version}.nupkg"
          printf 'base-version=%s\npackage-version=%s\npackage-artifact=%s\ncalculated-state=%s\ntag-state-fingerprint=%s\n' "$base_version" "$package_version" "$package_artifact" "$calculated_state" "$tag_state_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore with NuGet audit
        if: ${{ steps.metadata.outputs.branch-role != 'none' }}
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
        run: dotnet restore "$PROJECT_PATH" -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:WarningsAsErrors=NU1904%3BNU1903 -p:WarningsNotAsErrors=NU1901%3BNU1902

      - name: Build
        if: ${{ steps.metadata.outputs.branch-role != 'none' }}
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Pack calculated validation version
        if: ${{ steps.metadata.outputs.branch-role != 'none' }}
        shell: bash
        env:
          CALCULATED_VERSION: ${{ steps.version-state.outputs.package-version }}
          PROJECT_PATH: ${{ steps.metadata.outputs.project-path }}
        run: dotnet pack "$PROJECT_PATH" --configuration Release --no-restore --output artifacts -p:RepositoryCommit="$GITHUB_SHA" -p:PackageVersion="$CALCULATED_VERSION"

      - name: Upload exact package artifact
        if: ${{ steps.metadata.outputs.branch-role != 'none' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.version-state.outputs.package-artifact }}
          if-no-files-found: error
