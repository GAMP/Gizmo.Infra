name: Publish package to the internal registry
description: Independently revalidate caller state, destination, artifact, and provenance, then publish the exact prepared package to the caller internal registry with the caller GITHUB_TOKEN.
inputs:
  state:
    description: Opaque versioned package state emitted by the plan workflow.
    required: true
runs:
  using: composite
  steps:
    - name: Validate internal publisher invocation
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref }}
        REF_PROTECTED: ${{ github.ref_protected }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != push ]]; then
          echo "Publishing is allowed only from push." >&2
          exit 1
        fi
        if [[ "$REF_PROTECTED" != true || "$REF_NAME" != refs/heads/* ]]; then
          echo "Publishing requires a protected branch ref." >&2
          exit 1
        fi

    - name: Download exact package artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-package-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts

    - name: Parse state and revalidate destination and artifact
      id: revalidate
      shell: bash
      env:
        STATE: ${{ inputs.state }}
        STATE_PARSER: ${{ github.action_path }}/../../package/state.py
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        fail() { echo "$1" >&2; exit 1; }
        env_file="$RUNNER_TEMP/gizmo-state.env"
        shell_file="$RUNNER_TEMP/gizmo-state.shell"
        if ! printf '%s' "$STATE" | python3 "$STATE_PARSER" validate --role publishable --expect-publisher internal --github-env "$env_file" > "$shell_file"; then
          fail "The package state is missing, malformed, tampered, or unknown-version; refusing to publish."
        fi
        # shellcheck disable=SC1090
        . "$shell_file"
        cat "$env_file" >> "$GITHUB_ENV"

        response_file=$(mktemp)
        trap 'rm -f "$response_file"' EXIT
        if ! status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"); then
          fail "Could not fetch authenticated caller repository metadata."
        fi
        [[ "$status" == 200 ]] || fail "GitHub returned HTTP $status for caller repository metadata."
        if ! visibility=$(jq -er 'if type == "object" and (.visibility | type == "string") then .visibility else error("missing visibility") end' "$response_file"); then
          fail "GitHub returned malformed caller repository metadata."
        fi
        [[ "$visibility" == "$GIZMO_REPOSITORY_VISIBILITY" ]] || fail "Caller repository visibility drifted from the planned state; refusing to publish."
        [[ "$visibility" == private ]] || fail "The internal publisher requires a private caller repository; refusing to route visibility '$visibility'."
        [[ "$GIZMO_PUBLISHER" == internal ]] || fail "The planned publisher is not internal; refusing to publish."
        [[ "$GIZMO_EVENT" == push ]] || fail "The planned event is not push; refusing to publish."

        [[ -f "$GIZMO_ARTIFACT_PATH" ]] || fail "The exact prepared package artifact is missing."
        actual_digest=$(sha256sum "$GIZMO_ARTIFACT_PATH" | cut -d ' ' -f1)
        [[ "$actual_digest" == "$GIZMO_ARTIFACT_DIGEST" ]] || fail "The prepared package artifact digest does not match the planned state; refusing to publish."

    - name: Recheck tag state and internal package provenance
      id: collision
      shell: bash
      env:
        STATE_PARSER: ${{ github.action_path }}/../../package/state.py
        NUSPEC_PARSER: ${{ github.action_path }}/../../package/nuspec.py
        VALIDATE_ORIGIN: ${{ github.action_path }}/scripts/validate.mjs
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        response_file=$(mktemp)
        package_file=$(mktemp)
        tag_object_file=$(mktemp)
        rows_file=$(mktemp)
        trap 'rm -f "$response_file" "$package_file" "$tag_object_file" "$rows_file"' EXIT
        resolve_commit() {
          local object_type=$1 object_sha=$2 status depth=0
          while :; do
            case "$object_type" in
              commit) printf '%s' "$object_sha"; return 0 ;;
              tag)
                ((depth += 1))
                if (( depth > 16 )) || ! status=$(curl --silent --show-error --location --output "$tag_object_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"); then echo "Could not resolve an annotated package tag during publication recheck." >&2; return 1; fi
                if [[ "$status" != 200 ]] || ! object_type=$(jq -er '.object.type | strings' "$tag_object_file") || ! object_sha=$(jq -er '.object.sha | strings' "$tag_object_file"); then echo "GitHub returned a malformed annotated package-tag response during publication recheck." >&2; return 1; fi
                ;;
              *) echo "Package tag ref does not resolve to a commit." >&2; return 1 ;;
            esac
          done
        }
        page=1
        : > "$rows_file"
        while :; do
          if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$GIZMO_PACKAGE_ID/?per_page=100&page=$page"); then echo "Could not refetch caller-repository package tag refs." >&2; exit 1; fi
          if [[ "$status" != 200 ]] || ! jq -e 'type == "array" and all(.[]; (.ref | type == "string") and (.object | type == "object") and (.object.type | type == "string") and (.object.sha | type == "string"))' "$response_file" > /dev/null; then echo "GitHub returned a malformed package-tag-ref response during publication recheck." >&2; exit 1; fi
          while IFS=$'\t' read -r ref object_type object_sha; do
            [[ -z "$ref" ]] && continue
            resolve_commit "$object_type" "$object_sha" > /dev/null || exit 1
            printf '%s\t%s\n' "$ref" "$object_sha" >> "$rows_file"
          done < <(jq -r '.[] | [.ref, .object.type, .object.sha] | @tsv' "$response_file")
          count=$(jq -er 'length' "$response_file")
          if (( count < 100 )); then break; fi
          ((page += 1))
        done
        tags_json=$(jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {ref: .[0], objectSha: .[1]})' "$rows_file")
        if ! fingerprint=$(jq -nc --arg id "$GIZMO_PACKAGE_ID" --argjson tags "$tags_json" '{packageId: $id, tags: $tags}' | python3 "$STATE_PARSER" fingerprint); then echo "The observed package tag state is foreign or malformed; refusing to publish." >&2; exit 1; fi
        if [[ "$fingerprint" != "$GIZMO_TAG_STATE_FINGERPRINT" ]]; then echo "Calculated package state drifted before publication; refusing to publish." >&2; exit 1; fi

        package_id_lower=$(printf '%s' "$GIZMO_PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
        version_lower=$(printf '%s' "$GIZMO_PACKAGE_VERSION" | tr '[:upper:]' '[:lower:]')
        service_index_url="https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json"
        if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --user "$GITHUB_ACTOR:$GH_TOKEN" "$service_index_url"); then echo "Could not read the internal registry NuGet service index for the package recheck." >&2; exit 1; fi
        if [[ "$status" != 200 ]]; then echo "The internal registry returned HTTP $status for the NuGet service index during publication recheck." >&2; exit 1; fi
        if ! raw_package_base_address=$(jq -er '
          if type == "object" and (.resources | type == "array") then
            [.resources[]
             | select(
                 (.["@type"] | type == "string" and . == "PackageBaseAddress/3.0.0")
                 or (.["@type"] | type == "array" and (index("PackageBaseAddress/3.0.0") != null))
               )
             | .["@id"]
            ]
            | if length == 1 and (.[0] | type == "string") and (.[0] | length > 0) and (.[0] | test("[[:cntrl:]]") | not) then .[0] else empty end
          else
            error("malformed service index")
          end
        ' "$response_file" && printf 'x'); then echo "The internal registry returned a malformed, missing, or ambiguous PackageBaseAddress resource in its NuGet service index." >&2; exit 1; fi
        package_base_address=${raw_package_base_address%x}
        package_base_address=${package_base_address%$'\n'}
        if [[ "$package_base_address" == *[[:cntrl:]]* ]]; then
          echo "The internal registry returned a malformed PackageBaseAddress @id in its NuGet service index." >&2
          exit 1
        fi
        # The @id is untrusted; the checked-in validator only reads stdin and pins the trusted origin.
        if ! package_base_address=$(printf '%s' "$package_base_address" | node "$VALIDATE_ORIGIN"); then
          echo "The internal registry returned a malformed PackageBaseAddress @id in its NuGet service index." >&2
          exit 1
        fi
        package_base_address=${package_base_address%/}
        package_index_url="$package_base_address/${package_id_lower}/index.json"
        package_download_url="$package_base_address/${package_id_lower}/${version_lower}/${package_id_lower}.${version_lower}.nupkg"
        if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --user "$GITHUB_ACTOR:$GH_TOKEN" "$package_index_url"); then echo "Could not recheck whether the internal package version already exists." >&2; exit 1; fi
        case "$status" in
          200)
            jq -e 'type == "object" and (.versions | type == "array") and all(.versions[]; type == "string")' "$response_file" > /dev/null || { echo "The internal registry returned a malformed package-version response." >&2; exit 1; }
            if jq -e --arg version "$GIZMO_PACKAGE_VERSION" '.versions | index($version) != null' "$response_file" > /dev/null; then
              if ! status=$(curl --silent --show-error --location --output "$package_file" --write-out '%{http_code}' --user "$GITHUB_ACTOR:$GH_TOKEN" "$package_download_url"); then echo "Could not read the published internal package for collision provenance." >&2; exit 1; fi
              if [[ "$status" != 200 ]]; then echo "The internal registry returned HTTP $status for the published package; treating the existing version as an unverifiable collision." >&2; exit 1; fi
              nuspec_entries=$(unzip -Z1 "$package_file" 2>/dev/null | grep -i '\.nuspec$' || true)
              nuspec_count=$(printf '%s\n' "$nuspec_entries" | grep -c '[^[:space:]]' || true)
              if [[ "$nuspec_count" != 1 ]]; then echo "The existing internal package version does not contain exactly one nuspec; failing closed instead of publishing or creating a recovery tag." >&2; exit 1; fi
              nuspec_name=$(printf '%s\n' "$nuspec_entries" | grep '[^[:space:]]')
              nuspec_basename=${nuspec_name##*/}
              if [[ "${nuspec_basename,,}" != "${GIZMO_PACKAGE_ID,,}.nuspec" ]]; then echo "The existing internal package version nuspec is not the expected package nuspec; failing closed instead of publishing or creating a recovery tag." >&2; exit 1; fi
              nuspec=$(unzip -p "$package_file" "$nuspec_name" 2>/dev/null || true)
              # The nuspec is untrusted; provenance is parsed structurally, never by regex.
              if ! provenance_verdict=$(printf '%s' "$nuspec" | EXPECTED_PACKAGE_ID="$GIZMO_PACKAGE_ID" PACKAGE_VERSION="$GIZMO_PACKAGE_VERSION" python3 "$NUSPEC_PARSER"); then
                if [[ "$provenance_verdict" == id ]]; then
                  echo "The existing internal package version nuspec ID does not match the expected package ID; failing closed instead of publishing or creating a recovery tag." >&2
                elif [[ "$provenance_verdict" == version ]]; then
                  echo "The existing internal package version nuspec version does not match the expected package version; failing closed instead of publishing or creating a recovery tag." >&2
                elif [[ "$provenance_verdict" == commit ]]; then
                  echo "The existing internal package version has no authenticated provenance for this caller SHA; failing closed instead of publishing or creating a recovery tag." >&2
                else
                  echo "The existing internal package version has missing or malformed provenance; failing closed instead of publishing or creating a recovery tag." >&2
                fi
                exit 1
              fi
              printf 'package-state=published\n' >> "$GITHUB_OUTPUT"
            else
              printf 'package-state=unpublished\n' >> "$GITHUB_OUTPUT"
            fi
            ;;
          404) printf 'package-state=unpublished\n' >> "$GITHUB_OUTPUT" ;;
          *) echo "The internal registry returned HTTP $status while rechecking package publication." >&2; exit 1 ;;
        esac

    - name: Publish package to the internal registry
      if: ${{ steps.collision.outputs.package-state != 'published' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: dotnet nuget push "$GIZMO_ARTIFACT_PATH" --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" --api-key "$GH_TOKEN"

    - name: Report already-published same-SHA package
      if: ${{ steps.collision.outputs.package-state == 'published' }}
      shell: bash
      run: echo "Internal package version $GIZMO_PACKAGE_VERSION is already published for this caller SHA; skipping publication so the immutable release tag can be reconciled."
