name: Reconcile immutable package release tag
description: Independently revalidate the production policy role and package tag state, then create the missing immutable package-qualified release tag.
inputs:
  state:
    description: Opaque versioned package state emitted by the plan workflow.
    required: true
runs:
  using: composite
  steps:
    - name: Validate trusted tag invocation
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref }}
        REF_PROTECTED: ${{ github.ref_protected }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != push ]]; then
          echo "Tagging is allowed only from push." >&2
          exit 1
        fi
        if [[ "$REF_PROTECTED" != true || "$REF_NAME" != refs/heads/* ]]; then
          echo "Tagging requires a protected branch ref." >&2
          exit 1
        fi

    - name: Parse state and revalidate production policy role
      id: revalidate
      shell: bash
      env:
        STATE: ${{ inputs.state }}
        STATE_PARSER: ${{ github.action_path }}/../../package/state.py
      run: |
        set -euo pipefail
        export LC_ALL=C
        fail() { echo "$1" >&2; exit 1; }
        env_file="$RUNNER_TEMP/gizmo-state.env"
        shell_file="$RUNNER_TEMP/gizmo-state.shell"
        if ! printf '%s' "$STATE" | python3 "$STATE_PARSER" validate --role production --expect-publisher publishable --github-env "$env_file" > "$shell_file"; then
          fail "The package state is missing, malformed, tampered, or unknown-version; refusing to tag."
        fi
        # shellcheck disable=SC1090
        . "$shell_file"
        cat "$env_file" >> "$GITHUB_ENV"
        [[ "$GIZMO_EVENT" == push ]] || fail "Tagging is allowed only from push."
        [[ "$GIZMO_ROLE" == production ]] || fail "Tagging requires the production policy role; refusing to tag a '$GIZMO_ROLE' run."
        [[ "$GIZMO_TAG" == true ]] || fail "The planned state did not request a tag; refusing to tag."
        [[ "$GIZMO_PUBLISHER" == nuget || "$GIZMO_PUBLISHER" == internal ]] || fail "The planned state did not select a supported publisher; refusing to tag."

    - name: Refetch and recheck calculated state before tagging
      shell: bash
      env:
        STATE_PARSER: ${{ github.action_path }}/../../package/state.py
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        response_file=$(mktemp)
        tag_object_file=$(mktemp)
        rows_file=$(mktemp)
        trap 'rm -f "$response_file" "$tag_object_file" "$rows_file"' EXIT
        resolve_commit() {
          local object_type=$1 object_sha=$2 status depth=0
          while :; do
            case "$object_type" in
              commit) printf '%s' "$object_sha"; return 0 ;;
              tag)
                ((depth += 1))
                if (( depth > 16 )) || ! status=$(curl --silent --show-error --location --output "$tag_object_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"); then echo "Could not resolve an annotated package tag during tag recheck." >&2; return 1; fi
                if [[ "$status" != 200 ]] || ! object_type=$(jq -er '.object.type | strings' "$tag_object_file") || ! object_sha=$(jq -er '.object.sha | strings' "$tag_object_file"); then echo "GitHub returned a malformed annotated package-tag response during tag recheck." >&2; return 1; fi
                ;;
              *) echo "Package tag ref does not resolve to a commit." >&2; return 1 ;;
            esac
          done
        }
        page=1
        : > "$rows_file"
        while :; do
          if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$GIZMO_PACKAGE_ID/?per_page=100&page=$page"); then echo "Could not refetch caller-repository package tag refs." >&2; exit 1; fi
          if [[ "$status" != 200 ]] || ! jq -e 'type == "array" and all(.[]; (.ref | type == "string") and (.object | type == "object") and (.object.type | type == "string") and (.object.sha | type == "string"))' "$response_file" > /dev/null; then echo "GitHub returned a malformed package tag-ref response during tag recheck." >&2; exit 1; fi
          while IFS=$'\t' read -r ref object_type object_sha; do
            [[ -z "$ref" ]] && continue
            resolve_commit "$object_type" "$object_sha" > /dev/null || exit 1
            printf '%s\t%s\n' "$ref" "$object_sha" >> "$rows_file"
          done < <(jq -r '.[] | [.ref, .object.type, .object.sha] | @tsv' "$response_file")
          count=$(jq -er 'length' "$response_file")
          if (( count < 100 )); then break; fi
          ((page += 1))
        done
        tags_json=$(jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {ref: .[0], objectSha: .[1]})' "$rows_file")
        if ! fingerprint=$(jq -nc --arg id "$GIZMO_PACKAGE_ID" --argjson tags "$tags_json" '{packageId: $id, tags: $tags}' | python3 "$STATE_PARSER" fingerprint); then echo "The observed package tag state is foreign or malformed; refusing to create a tag." >&2; exit 1; fi
        if [[ "$fingerprint" != "$GIZMO_TAG_STATE_FINGERPRINT" ]]; then echo "Calculated package state drifted before tagging; refusing to create a tag." >&2; exit 1; fi

    - name: Create or reconcile immutable release tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        response_file=$(mktemp)
        tag_object_file=$(mktemp)
        trap 'rm -f "$response_file" "$tag_object_file"' EXIT
        [[ "$GIZMO_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "The planned source commit is not a complete 40-character SHA." >&2; exit 1; }
        if ! status=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$GIZMO_RELEASE_TAG"); then echo "Could not check whether the release tag is already claimed." >&2; exit 1; fi
        case "$status" in
          200)
            # Resolve a lightweight or annotated ref to its commit before comparing; never move a tag.
            if ! object_type=$(jq -er '.object.type | strings' "$response_file") || ! object_sha=$(jq -er '.object.sha | strings' "$response_file"); then echo "GitHub returned a malformed release-tag response." >&2; exit 1; fi
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "GitHub returned a malformed release-tag object SHA." >&2; exit 1; }
            depth=0
            while :; do
              case "$object_type" in
                commit) break ;;
                tag)
                  (( depth += 1 ))
                  if (( depth > 16 )); then echo "The existing release tag did not resolve to a commit within the depth limit; refusing to move it." >&2; exit 1; fi
                  if ! status=$(curl --silent --show-error --location --output "$tag_object_file" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha"); then echo "Could not resolve the annotated release tag; the tag was not moved or overwritten." >&2; exit 1; fi
                  if [[ "$status" != 200 ]]; then echo "GitHub returned HTTP $status while resolving the annotated release tag; the tag was not moved or overwritten." >&2; exit 1; fi
                  if ! object_type=$(jq -er '.object.type | strings' "$tag_object_file") || ! object_sha=$(jq -er '.object.sha | strings' "$tag_object_file"); then echo "GitHub returned a malformed annotated release-tag response." >&2; exit 1; fi
                  [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "GitHub returned a malformed annotated release-tag object SHA." >&2; exit 1; }
                  ;;
                *) echo "The existing release tag does not resolve to a commit; refusing to move it." >&2; exit 1 ;;
              esac
            done
            if [[ "$object_sha" != "$GIZMO_SHA" ]]; then echo "Release tag already exists for a different commit; refusing to move it." >&2; exit 1; fi
            ;;
          404) request_body=$(jq -nc --arg ref "refs/tags/$GIZMO_RELEASE_TAG" --arg sha "$GIZMO_SHA" '{ref: $ref, sha: $sha}'); if ! status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --request POST --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' --data "$request_body" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs"); then echo "Could not create the release tag; the tag was not moved or overwritten." >&2; exit 1; fi; if [[ "$status" != 201 ]]; then echo "GitHub returned HTTP $status while creating the release tag; the tag was not moved or overwritten." >&2; exit 1; fi ;;
          *) echo "GitHub returned HTTP $status while checking the release tag." >&2; exit 1 ;;
        esac
